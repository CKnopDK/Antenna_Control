<!DOCTYPE html>
<html>
  <html lang='da'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Antenne Kontrol</title>
    <style>
      /* Sørger for at padding og border ikke lægges oveni bredden */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      div { horizontal-align: left; }
      body{ 
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #f0b090; 
        text-align:center; 
        padding: 20px;
      }
      table, th, td { border: 2px solid black; table-layout: fixed; white-space: normal;}
      .tb1{
        width: 100%; max-width: 395px;
        table-layout: fixed; white-space: normal;
        border-collapse: collapse; /* Prevent double borders */
        border-style: none;
      }
      .td1{
        width: 36px;
        max-width: 36px;
        //heigth: 30px;
        padding: 0px;
        text-align: center;
        border-style: solid;
      }
      .td2{
        width:auto;
        max-width: 315px;
        text-align: center;
        border-style: solid;
      }
      .tdleft{
        width:36px;
        max-width: 36px;
        height:20px;
      }
      .tdright{
        width:36px;
        max-width: 36px;
        height:20px;
      }
      .tdborder{
        border-style: none;
      }
      /* Styling for 2 cifre (ca. 4ch bredde pga. pile)  for input type number*/
      .w-2 { width: 40px; text-align: center; }
      .w-5 { width: 60px; text-align: center; }
      /* Styling for 5 cifre (ca. 7ch bredde pga. pile)  for input type number*/
      .container{ max-width:520px; margin:0 auto; padding:25px; }
      .card{
        background: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 0px;
        padding-right: 0px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 395px;
        margin: 10px auto;
      }
      div.b {
        background: #f0b090;
        width: 100px;
        height: 120px;
      }
      .btn{
        width: 250px;
        padding: 12px 24px;
        margin: 4px 0;
        font-size: 16px;
        border:none;
        border-radius: 5px;
        color:white;
        cursor:pointer;
      }
      .btn-on{ background:#2ecc71; }
      .btn-off{ background:#e74c3c; }
      .btn-all{ background:#3498db; } //#34495e; }
      .btn-cfg{ background:#3498db; }
      .btn-nvs{ background:#3400db; }
      .locked{ opacity:0.45; cursor:not-allowed; }
      .gear{
        font-size: 18px; //24px;
        color:#000;
      }
      .small{
        color:#888;
        font-size:15px;
        margin-top:5px;
      }
      .BleInfo{
        color:#ff0000;
        font-size:16px;
        margin-top:15px;
      }
      .warning{
        // color:#ff9999;
        color:#ff0000;
        font-size:16px;
        margin-top:15px;
        display:none;
      }
      label{
        display:block;
        text-align:left;
        color:#000; //#bbb;
        margin-top:8px;
      }
      .checkboxline{
        display:flex;
        align-items:center;
        gap:12px;
        margin:5px 0 5px 0;
        color:#000; // #bbb;
      }
      .checkboxline input{
        width:auto;
        margin:0;
      }
      .statusbox{
        background:#ffffff; //#1a1a1a;
        border:1px solid #444;
        border-radius:8px;
        padding:10px;
        margin:14px 0 24px 0;
        text-align:left;
      }
      .statusrow{
        display:flex;
        justify-content:space-between;
        // gap:12px;
        border-bottom:1px solid #333;
        padding:10px 0;
        font-size:15px;
      }
      .statusrow:last-child{ border-bottom:none; }
      .statuslabel{ color:#000; //#aaa; }
      .statusvalue{ color:#3498db; text-align:right; font-weight: bold; word-break:break-word; }
      .statusvalue1{ color:#3498db; font-weight: bold; word-break:break-word; }
      .statusvalue2{ color:#3498db; padding-right: 10px; font-weight: bold; word-break:break-word; }
      .status{
        font-weight: bold;
        padding: 0;
        margin: 2px 0;
        color:blue; //#000;
        line-height: 1.2;
      }
      .p1{
        padding: 0;
        margin: 4px 0;
        line-height: 1.2;    /* 1.2 Mindre linjeafstand inden i afsnit */
      }
    </style>
  </head>


  <body>
    <div class="card">
      <div class="div.b">
        <table class='tb1'>
          <tr>
            <td class='tdleft tdborder'></td>
            <td class='td2 tdborder' rowspan='3'><h2 id="main-title"> Antenne Kontrol </h2></td>
            <td class='tdleft tdborder'></td>
          </tr>
          <tr>
            <td class='td1' bgcolor="Yellow"><a class='gear' onclick='gotowifi()'>Wifi</a></td>
            <!--<td class='td2 tdborder' rowspan='2'><h1 id="main-title"> Antenne Kontrol </h1></td>-->
            <td class='td1' bgcolor="Yellow"><a class='gear' onclick='initBluetooth()'>Pair</a></td>
          </tr>
          <tr>
            <td class='tdright tdborder'></td>
            <td class='tdright tdborder'></td>
          </tr>
        </table>
      </div>

      <div id="relays-container">
        <button id='antBtn1' class='btn btn-off' onclick='selectAnt(1)'>Delta Loop 40m</button>
        <button id='antBtn2' class='btn btn-off' onclick='selectAnt(2)'>HF All band vertical</button> 
        <button id='antBtn3' class='btn btn-off' onclick='selectAnt(3)'>Antenne 3</button> 
        <button id='antBtn4' class='btn btn-off' onclick='selectAnt(4)'>Antenne 4</button>
      </div>
        <button id='offBtn' class='btn btn-all' onclick='allOff()'>SLUK ALLE</button>
<!--        <button id='conBtn' class='btn btn-all' onclick='initBluetooth()'>Forbind BLE</button> -->
    </div>
    <div class="card">
      <h2>Status (SYSTEM)</h2>
      <div id='txWarning' class='warning'>TX/PTT aktiv - antenneskift er låst</div>
      <div id='statusText' class='small'>Aktiv antenne: </div>
      <div id='wifiText' class='small'>Adresse: http://antctrl.local</div>
    </div>
    <div class="card">
      <h2>Sensor Status (ADC)</h2>
      <p class="p1">Antenne Trace (4): <span id="adc0" class="status">0</span></p>
      <p class="p1">Batteri spænding: <span id="battery" class="status">0</span></p>
      <p class="p1">Batteri Status: <span id="batTxt" class="status"></span></p>
    </div>

    <script>
      // Globale Bluetooth-variabler
      let bleDevice = null;
      let rxCharacteristic = null; // Send til ESP32
      let txCharacteristic = null; // Modtag fra ESP32

      // UUIDs - Skal matche ESP32 koden nøjagtigt
      const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
      const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
      const CHARACTERISTIC_UUID_TX = "d2a3f4e5-5678-4abc-bcde-f123456789ab";

      // Lokalt array til at holde på antennenavnene, når de lander fra ESP32'erens RAM
      let pagetitel = "Antenne Kontrol";
      let antenneNavne = ["Antenne 1", "Antenne 2", "Antenne 3", "Antenne 4"];
      
      // 1. Opret forbindelse (Kaldes via en "Forbind" knap i dit HTML)
      async function initBluetooth() {
        try {
          document.getElementById('statusText').innerText = "Scanner efter enhed...";
          
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
          });

          const server = await bleDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);

          rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

          // Start lytning efter live-data (Notify)
          await txCharacteristic.startNotifications();
          txCharacteristic.addEventListener('characteristicvaluechanged', haandterBleData);

          document.getElementById('statusText').innerText = "Forbundet! Henter data...";
          bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

          // Anmod ESP32 om at sende alle de dynamiske navne og tilstande fra dens RAM
          setTimeout(() => {
            sendBleKommando("GET_INITIAL_DATA");
          }, 300);

        } catch (error) {
          console.error("Bluetooth fejl: ", error);
          document.getElementById('statusText').innerText = "Forbindelse fejlede.";
        }
      }

      // 2. Modtag og fordel data dynamisk i dit UI (Erstatning for %REPLACE%)
      function haandterBleData(event) {
        try {
          const decoder = new TextDecoder('utf-8');
          const rawString = decoder.decode(event.target.value);
          console.log("Rådata:", rawString);

          const felter = rawString.split(';');
          const datatype = felter[0];

          // Håndtering af Titlerne
          // if (datatype === "TITL") {
          //   if (felter[1]){
          //     document.title = felter[1];
          //     let b = document.getElementById('main-title');
          //     if (b) b.innerText = " " + felter[1] + " ";
          //   }
          // }
          
          // Håndtering af antennenavne (Overskriver knappernes tekst live)
          if (datatype === "NAME") {
            for (let i = 1; i <= 4; i++) {
              if (felter[i]) {
                antenneNavne[i - 1] = felter[i];
                let b = document.getElementById('antBtn' + i);
                if (b) b.innerText = felter[i];
              }
            }
            if (felter[5]) {
              pagetitel = felter[5];
              document.title = felter[5];
              let c = document.getElementById('main-title');
              if (c) c.innerText = " " + felter[5] + " ";
            }
          }

          // Håndtering af relætilstande og TX-spærrings-advarsel
          if (datatype === "CTRL") {
            const aktivAntenne = parseInt(felter[1]);
            const pttAktiv = parseInt(felter[2]) === 1;

            // Vis/skjul din TX/PTT advarselsboks
            let txWarningElement = document.getElementById('txWarning');
            if (txWarningElement) {
              txWarningElement.style.display = pttAktiv ? 'block' : 'none';
            }

            // Opdater din aktiv-antenne tekstindikator
            let text = 'Aktiv antenne: ';
            if (aktivAntenne === 0) {
              text += 'ingen';
            } else {
              text += antenneNavne[aktivAntenne - 1] || ("Antenne " + aktivAntenne);
            }
            let bs = document.getElementById('statusText');
            if (bs) {
              bs.innerText = text;
              bs.classList = 'small';
            }
          }

          // Opdater dine relæ knapers status RØD = OFF, GRØN = ON
          if (datatype === "STAT") {
            // Opdater klasserne (farverne) på dine 4 antenneknapper
            for (let i = 1; i <= 4; i++) {
              let b = document.getElementById('antBtn' + i);
              if (b) {
                let relaeState = parseInt(felter[i]) === 1;
                b.classList = (relaeState ? 'btn btn-on' : 'btn btn-off');
              }
            }
          }
          
          // Håndtering af live sensor-data (ADC og batteriovervågning)
          if (datatype === "SENS") {
            if(document.getElementById('adc0'))    document.getElementById('adc0').innerText = felter[1];
            if(document.getElementById('battery')) document.getElementById('battery').innerText = felter[2];
            if(document.getElementById('batTxt'))  document.getElementById('batTxt').innerText = felter[3];
          }
          
          // Håndtering af live RF målinger
          if (datatype === "RFDV") {
            if(document.getElementById('adc0'))    document.getElementById('adc0').innerText = felter[1];
          }
          
          // Håndtering af live Batteri målinger
          if (datatype === "BATV") {
            if(document.getElementById('battery')) document.getElementById('battery').innerText = felter[1];
            if(document.getElementById('batTxt'))  document.getElementById('batTxt').innerText = felter[2];
          }

        } catch (e) {
          console.error("Fejl i data-parsing: ", e);
        }
      }

      // 3. Send kommandoer til ESP32
      function sendBleKommando(kommando) {
        if (rxCharacteristic) {
          const encoder = new TextEncoder();
          const buffer = encoder.encode(kommando);
          rxCharacteristic.writeValue(buffer).catch(err => console.error("Send fejl:", err));
        }
      }

      // Knap-interaktioner (Mapper direkte til dine gamle WebSocket-funktioner)
      function selectAnt(index) { sendBleKommando("TOGGLE;" + index); }
      function allOff() { sendBleKommando("ALLOFF"); }
      function ctrlInfo(index) { sendBleKommando("GETINFO;" + index); }
      function gotowifi() { sendBleKommando("SWITCH_TO_WIFI"); }

      function onBleDisconnected() {
        let bs = document.getElementById('statusText');
        if (bs) {
          bs.innerText = "Forbindelse afbrudt. Klik for at forbinde.";
          bs.classList = 'BleInfo';
        }
      }

      window.onload = function() {
        let bs = document.getElementById('statusText');
        if (bs) {
          bs.innerText = "Klar til Bluetooth-forbindelse.";
          bs.classList = 'BleInfo';
        }
      };

    </script>
    
  </body>
</html>
