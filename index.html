<!DOCTYPE html>
<html>
  <html lang='da'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Antenne Kontrol BLE</title>
    <style>
      /* Sørger for at padding og border ikke lægges oveni bredden */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      div { horizontal-align: left; }
      body{ 
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #f0b090; 
        text-align:center; 
        padding: 20px;
      }
      /*
       table, th, td { 
        border: 2px solid black;
        table-layout: fixed;
        white-space: normal;
      }
      */
      .tb1{
        width: 100%; max-width: 395px;
        table-layout: fixed; white-space: normal;
        border-collapse: collapse; /* Prevent double borders */
        border-style: none;
      }
      table td {
        vertical-align: middle; /* Centrerer knappen lodret */
        padding: 0;             /* Giver luft omkring knappen */
      }
      /* Styling af selve knappen */
      table td button {
        background-color: red !important; /* Grøn */
      }
      .table-btn {
        display: inline-block;
        background-color: #4CAF50 !important; /* #4CAF50 Grøn */
        color: white; /* white; */
        width: 44px;
        max-width: 44px;
        height: 34px;
        padding: 0;
        margin: 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.2; /* Sikrer at teksten ikke hopper */
      }
      .td1{
        width: 44px;
        max-width: 44px;
        height: 34px;
        padding: 0px;
        margin: 0;
        text-align: center;
        /* border-style: solid; */
      }
      .td2{
        width:auto;
        max-width: 315px;
        text-align: center;
        border-style: solid;
      }
      .tdleft{
        width: 44px;
        max-width: 44px;
        height:20px;
      }
      .tdright{
        width: 44px;
        max-width: 44px;
        height:20px;
      }
      .tdborder{
        border-style: none;
      }
      .card{
        background: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 0px;
        padding-right: 0px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 395px;
        margin: 10px auto;
      }
      div.b {
        background: #f0b090;
        width: 100px;
        height: 120px;
      }
      .btn{
        width: 250px;
        padding: 12px 24px;
        margin: 4px 0;
        font-size: 16px;
        border:none;
        border-radius: 5px;
        color:white;
        cursor:pointer;
      }
      .btn-on{ background:#2ecc71; }
      .btn-off{ background:#e74c3c; }
      .btn-all{ background:#3498db; }
      .gear{
        font-size: 18px; /* 24px; */
        color:#000;
      }
      .small{
        color:#888;
        font-size:15px;
        margin-top:5px;
      }
      .BleInfo{
        color:#ff0000;
        font-size:16px;
        margin-top:15px;
      }
      .warning{
        /* color:#ff9999; */
        color:#ff0000;
        font-size:16px;
        margin-top:15px;
        display:none;
      }
      .status{
        font-weight: bold;
        padding: 0;
        margin: 2px 0;
        color:blue; /* #000; */
        line-height: 1.2;
      }
      .p1{
        padding: 0;
        margin: 4px 0;
        line-height: 1.2;    /* 1.2 Mindre linjeafstand inden i afsnit */
      }
    </style>
  </head>


  <body>
    <div class="card">
      <div class="div.b">
        <table class='tb1'>
          <tr>
            <td class='tdleft tdborder'></td>
            <td class='td2 tdborder' rowspan='3'><h2 id="main-title"> Antenne Kontrol </h2></td>
            <td class='tdleft tdborder'></td>
          </tr>
          <tr>
            <td class='td1'><button id='WifiBtn' class='table-btn' onclick='gotowifi()'>WiFi</button></td>
            <td class='td1'><button id='BlePair' class='table-btn' onclick='initBluetooth()'>Pair</button></td>
          </tr>
          <tr>
            <td class='tdright tdborder'></td>
            <td class='tdright tdborder'></td>
          </tr>
        </table>
      </div>

      <!-- Advarselsboks - skjult som standard via display:none -->
      <div id="browser-warning" style="display: none; background-color: #ffe6e6; color: #b30000; border: 1px solid #ffb3b3; padding: 15px; margin: 15px 0; border-radius: 5px; font-family: sans-serif;">
        <strong style="font-size: 16px;">⚠️ Bemærk venligst:</strong>
        <p id="warning-text" style="margin: 8px 0 0 0; line-height: 1.4;"></p>
      </div>

      <div id="relaysContainer">
        <button id='antBtn1' class='btn btn-off' onclick='selectAnt(1)'>Antenne 1</button>
        <button id='antBtn2' class='btn btn-off' onclick='selectAnt(2)'>Antenne 2</button> 
        <button id='antBtn3' class='btn btn-off' onclick='selectAnt(3)'>Antenne 3</button> 
        <button id='antBtn4' class='btn btn-off' onclick='selectAnt(4)'>Antenne 4</button>
        <button id='offBtn' class='btn btn-all' onclick='allOff()'>SLUK ALLE</button>
      </div>
    </div>
    <div class="card">
      <h2>Status (SYSTEM)</h2>
      <div id='txWarning' class='warning'>TX/PTT aktiv - antenneskift er låst</div>
      <div id='statusText' class='small'>Aktiv antenne: </div>
      <div id='wifiText' class='small'>Adresse: http://antctrl.local</div>
    </div>
    <div class="card">
      <h2>Sensor Status (ADC)</h2>
      <p class="p1">Antenne Trace: <span id="adc0" class="status">0</span></p>
      <p class="p1">Batteri spænding: <span id="battery" class="status">0</span></p>
      <p class="p1">Batteri Status: <span id="batTxt" class="status"></span></p>
    </div>

    <script>
      // Globale Bluetooth-variabler
      let bleDevice = null;
      let rxCharacteristic = null; // Send til ESP32
      let txCharacteristic = null; // Modtag fra ESP32
      let harBleFejl = false; // udgangspunkt ingen fejl omkring BLE

      const warningBox = document.getElementById('browser-warning');
      const warningText = document.getElementById('warning-text');
      const connectBtn = document.getElementById('BlePair'); // Sørg for at dette ID matcher din knap
      const relayBlock = document.getElementById('relaysContainer');

      // UUIDs - Skal matche ESP32 koden nøjagtigt
      const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
      const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
      const CHARACTERISTIC_UUID_TX = "d2a3f4e5-5678-4abc-bcde-f123456789ab";

      // Lokalt array til at holde på antennenavnene, når de lander fra ESP32'erens RAM
      let pagetitel = "Antenne Kontrol";
      let antenneNavne = ["Antenne 1", "Antenne 2", "Antenne 3", "Antenne 4"];
      
      // 1. Opret forbindelse (Kaldes via en "Forbind" knap i dit HTML)
      async function initBluetooth() {
        try {
          document.getElementById('statusText').innerText = "Scanner efter enhed...";
          
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
          });

          if (!bleDevice) return;
          
          const server = await bleDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);

          rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

          // Start lytning efter live-data (Notify)
          await txCharacteristic.startNotifications();
          txCharacteristic.addEventListener('characteristicvaluechanged', haandterBleData);

          document.getElementById('statusText').innerText = "Forbundet! Henter data...";
          bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

          // Anmod ESP32 om at sende alle de dynamiske navne og tilstande fra dens RAM
          setTimeout(() => {
            sendBleKommando("GET_INITIAL_DATA");
          }, 300);

          let wfbtn = document.getElementById('WifiBtn');
          
          // luk op for WiFi knappen
          if (wfbtn) wfbtn.disabled = false;
          if (relayBlock) relayBlock.style.display = "block";
          if (connectBtn) connectBtn.disabled = false;
          if (warningBox) warningBox.style.display = "none";
          
        } catch (error) {
          console.error("Bluetooth fejl: ", error);
          document.getElementById('statusText').innerText = "Forbindelse fejlede.";
        }
      }

      // 2. Modtag og fordel data dynamisk i dit UI (Erstatning for %REPLACE%)
      function haandterBleData(event) {
        try {
          const decoder = new TextDecoder('utf-8');
          const rawString = decoder.decode(event.target.value);
          console.log("Rådata:", rawString);

          const felter = rawString.split(';');
          const datatype = felter[0];
          
          // Håndtering af antennenavne (Overskriver knappernes tekst live)
          if (datatype === "NAME") {
            for (let i = 1; i <= 4; i++) {
              if (felter[i]) {
                antenneNavne[i - 1] = felter[i];
                let b = document.getElementById('antBtn' + i);
                if (b) b.innerText = felter[i];
              }
            }
            if (felter[5]) {
              pagetitel = felter[5];
              document.title = felter[5];
              let c = document.getElementById('main-title');
              if (c) c.innerText = " " + felter[5] + " ";
            }
          }

          // Håndtering af relætilstande og TX-spærrings-advarsel
          if (datatype === "CTRL") {
            const aktivAntenne = parseInt(felter[1]);
            const pttAktiv = parseInt(felter[2]) === 1;

            // Vis/skjul din TX/PTT advarselsboks
            let txWarningElement = document.getElementById('txWarning');
            if (txWarningElement) {
              txWarningElement.style.display = pttAktiv ? 'block' : 'none';
            }

            // Opdater din aktiv-antenne tekstindikator
            let text = 'Aktiv antenne: ';
            if (aktivAntenne === 0) {
              text += 'ingen';
            } else {
              text += antenneNavne[aktivAntenne - 1] || ("Antenne " + aktivAntenne);
            }
            let bs = document.getElementById('statusText');
            if (bs) {
              bs.innerText = text;
              bs.classList = 'small';
            }
          }

          // Opdater dine relæ knapers status RØD = OFF, GRØN = ON
          if (datatype === "STAT") {
            // Opdater klasserne (farverne) på dine 4 antenneknapper
            for (let i = 1; i <= 4; i++) {
              let b = document.getElementById('antBtn' + i);
              if (b) {
                let relaeState = parseInt(felter[i]) === 1;
                b.classList = (relaeState ? 'btn btn-on' : 'btn btn-off');
              }
            }
          }
          
          // Håndtering af live sensor-data (ADC og batteriovervågning)
          if (datatype === "SENS") {
            if(document.getElementById('adc0'))    document.getElementById('adc0').innerText = felter[1];
            if(document.getElementById('battery')) document.getElementById('battery').innerText = felter[2];
            if(document.getElementById('batTxt'))  document.getElementById('batTxt').innerText = felter[3];
          }
          
          // Håndtering af live RF målinger
          if (datatype === "RFDV") {
            if(document.getElementById('adc0'))    document.getElementById('adc0').innerText = felter[1];
          }
          
          // Håndtering af live Batteri målinger
          if (datatype === "BATV") {
            if(document.getElementById('battery')) document.getElementById('battery').innerText = felter[1];
            if(document.getElementById('batTxt'))  document.getElementById('batTxt').innerText = felter[2];
          }
          
          if (datatype === "BATT") {
            if(document.getElementById('batTxt'))  document.getElementById('batTxt').innerText = felter[2];
          }

        } catch (e) {
          console.error("Fejl i data-parsing: ", e);
        }
      }

      // 3. Send kommandoer til ESP32
      async function sendBleKommando(kommando) {
        if (!rxCharacteristic) return;
        
        try{
          const encoder = new TextEncoder();
          const buffer = encoder.encode(kommando);
          console.log("Sender kommando:", kommando);
          
          await rxCharacteristic.writeValue(buffer);
          
          if(kommando === "SWITCH_TO_WIFI"){
            console.log("WiFi-kommando sendt. Venter kort, og lukker BLE pænt...");
            await new Promise(resolve => setTimeout(resolve, 150));
            
            if(bleDevice && bleDevice.gatt.connected){
              await bleDevice.gatt.disconnect();
            }
          }
        }catch(err){
          if(kommando === "SWITCH_TO_WIFI" && (err.name === 'NotSupportedError' || err.message.includes('GATT'))){
            console.log("ESP32 afbrød som forventet under WiFi-skift.");
          }else{
            console.error("Send fejl:", err);
          }
        }
      }

      // Knap-interaktioner (Mapper direkte til dine gamle WebSocket-funktioner)
      function selectAnt(index) { sendBleKommando("TOGGLE;" + index); }
      function allOff() { sendBleKommando("ALLOFF"); }
      function ctrlInfo(index) { sendBleKommando("GETINFO;" + index); }
      
      async function gotowifi() {
        warningText.innerHTML = "Du har nu skiftet tilbage til WiFi, derfor virker denne browser ikke, før du har skiftet tilbage til BlueTooth!";
        warningBox.style.display = "block";
        if (relayBlock) relayBlock.style.display = "none";

        await sendBleKommando("SWITCH_TO_WIFI");
      }

      function onBleDisconnected() {
        let bs = document.getElementById('statusText');
        let wfbtn = document.getElementById('WifiBtn');

        if (wfbtn) {
          wfbtn.disabled = true;
        }
        if (bs) {
          bs.innerText = "Forbindelse afbrudt. Klik for at forbinde.";
          bs.classList = 'BleInfo';
        }
      }

      window.onload = function() {
        let wfbtn = document.getElementById('WifiBtn');
        let bs = document.getElementById('statusText');
        if (wfbtn) {
          wfbtn.disabled = true;
        }
        if (bs && !harBleFejl) {
          bs.innerText = "Klar til Bluetooth-forbindelse.";
          bs.classList = 'BleInfo';
        }
      };

      window.addEventListener('DOMContentLoaded', () => {
        const bs = document.getElementById('statusText');

        const userAgent = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isSamsung = /SamsungBrowser/.test(userAgent);

        if (isIOS) {
          warningText.innerHTML = "Apple tillader ikke Bluetooth i standard-browsere (Chrome/Safari). For at bruge denne app på din iPhone/iPad, skal du hente den gratis app <strong>'Bluefy'</strong> i App Store og åbne dette link derinde.";
          warningBox.style.display = "block";
          if (relayBlock) relayBlock.style.display = "none";
          if (connectBtn) connectBtn.disabled = true;
          if (bs) {
            bs.innerText = "Ingen Bluetooth adgang!";
            bs.classList = 'BleInfo';
            harBleFejl = true; // <--- HUSK FEJLEN
          }
        } 
        else if (isSamsung) {
          warningText.innerHTML = "Du bruger Samsung Internet, som ofte blokerer for Bluetooth-forbindelsen. Vi anbefaler kraftigt, at du åbner dette link i <strong>Google Chrome</strong> eller <strong>Microsoft Edge</strong> i stedet for at undgå fejl.";
          warningBox.style.display = "block";
        } 
        else if (!navigator.bluetooth) {
          warningText.innerHTML = "Denne browser understøtter ikke Web Bluetooth, eller Bluetooth er deaktiveret på din enhed. Skift venligst til en opdateret udgave af <strong>Google Chrome</strong> eller <strong>Microsoft Edge</strong>.";
          warningBox.style.display = "block";
          if (relayBlock) relayBlock.style.display = "none";
          if (connectBtn) connectBtn.disabled = true;
          if (bs) {
            bs.innerText = "Ingen Bluetooth adgang!";
            bs.classList = 'BleInfo';
            harBleFejl = true; // <--- HUSK FEJLEN
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker Registreret!'));
      }
    </script>
    
  </body>
</html>
